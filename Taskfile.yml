version: '3'

vars:
  APP_NAME: arubox
  # The one place the version is written. The executable's version resource
  # and the build itself take it from here; release CI checks the tag and
  # CHANGELOG.md against it.
  VERSION: 0.2.0
  # Windows wants plain numbers, so a prerelease uses those of the release
  # it leads to.
  NUMERIC_VERSION: '{{index (splitList "-" .VERSION) 0}}'
  BIN_DIR: bin
  LDFLAGS_VERSION: -X github.com/shirumesu/arubox/internal/core.Version={{.VERSION}}
  # go-winres writes the icon, manifest and version resource the linker
  # picks up as a .syso file.
  WINRES: go run github.com/tc-hib/go-winres@v0.3.3

tasks:
  default:
    cmds:
      - task --list

  version:
    desc: Print the version
    cmds:
      - echo {{.VERSION}}

  icons:
    desc: Render the icons from the SVG sources in build/icons
    cmds:
      - rsvg-convert -w 256 -h 256 build/icons/appicon.svg -o build/appicon.png
      - rsvg-convert -w 32 -h 32 build/icons/tray.svg -o internal/core/assets/tray.png
      - '{{.WINRES}} icon -o build/windows/icon.ico build/appicon.png'
      - cp build/windows/icon.ico internal/core/assets/app.ico

  build:
    desc: Build bin/arubox.exe, natively or cross-compiled (ARCH=amd64 or arm64)
    vars:
      ARCH: '{{.ARCH | default "amd64"}}'
    cmds:
      - task: exe
        vars:
          ARCH: '{{.ARCH}}'
          OUT: '{{.APP_NAME}}.exe'
          FLAGS: -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui {{.LDFLAGS_VERSION}}"

  exe:
    internal: true
    vars:
      SYSO: rsrc_windows_{{.ARCH}}.syso
    cmds:
      - defer: rm -f {{.SYSO}}
      - mkdir -p {{.BIN_DIR}}
      # build/windows/winres.json holds the icon, the manifest (per-monitor
      # DPI, common controls 6) and the version resource's names.
      - >-
        {{.WINRES}} make --in build/windows/winres.json --arch {{.ARCH}} --out rsrc
        --file-version {{.NUMERIC_VERSION}}.0 --product-version {{.VERSION}}
      - go build {{.FLAGS}} -o {{.BIN_DIR}}/{{.OUT}} .
    env:
      GOOS: windows
      GOARCH: '{{.ARCH}}'
      CGO_ENABLED: '0'

  # Without -H windowsgui the program keeps its console, so logs show in
  # the terminal.
  run:
    desc: Build a development build and run it
    cmds:
      - task: exe
        vars:
          ARCH: '{{ARCH}}'
          OUT: '{{.APP_NAME}}.dev.exe'
          FLAGS: -buildvcs=false -ldflags="{{.LDFLAGS_VERSION}}-dev"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.exe"'

  test:
    desc: Run the Go tests
    env:
      GOOS: windows
      CGO_ENABLED: '0'
    cmds:
      - go test ./...

  lint:
    desc: Lint the Go code
    env:
      GOOS: windows
      CGO_ENABLED: '0'
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format the Go code
    cmds:
      - golangci-lint fmt ./...
