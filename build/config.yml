# Configuration for `wails dev` (run through `task dev`).
version: '3'

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - .task
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: task bindings
      type: blocking
    - cmd: task dev:frontend
      type: background
      readiness:
        http: "http://localhost:9245/"
        timeout: "60s"
        interval: "200ms"
    - cmd: task run
      type: primary
      exit_policy: shutdown
