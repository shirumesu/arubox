version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        # The error is GetLastError, meaningful only when the result reports
        # a failure; callers check the result instead.
        - (*golang.org/x/sys/windows.LazyProc).Call
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: early-return
    gosec:
      excludes:
        - G104 # unchecked errors are errcheck's job, which allows Close and Remove
        - G204 # subprocess with variable arguments: only fixed system tools are run
        - G301 # 0755 directories are intended for settings and logs
        - G302
        - G304 # file paths come from the user's own config/log directories
        - G115 # integer conversions are to pixel bytes and system types, bounded where they are made
  exclusions:
    presets:
      - std-error-handling
    rules:
      # System calls need unsafe pointers; they are confined to the platform
      # and UI layers, the ONNX Runtime binding and the speech players.
      - path: internal/(platform|fileindex|ort|ui)/|internal/modules/translate/(aloud|mci|sapi)\.go
        linters: [gosec]
        text: "G103"
      # A window procedure gets pointers to structures as an LPARAM, and
      # GlobalLock returns its memory as an integer.
      - path: internal/(ui/(app|window)|platform/cliptext_windows)\.go
        linters: [govet]
        text: "possible misuse of unsafe.Pointer"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/shirumesu/arubox
